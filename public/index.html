<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>ORAK AI</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#eef3ff;font-family:system-ui,Arial;min-height:100vh;display:flex;flex-direction:column}.top{padding:18px 5%;border-bottom:1px solid #263248;display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#16a085,#2563eb);display:grid;place-items:center;font-weight:800}.top small{display:block;color:#9eacc4}.wrap{width:min(850px,94%);margin:26px auto;display:flex;flex-direction:column;flex:1}.welcome{text-align:center;margin:35px 0 20px}.welcome h1{font-size:clamp(28px,6vw,42px);margin:8px}.welcome p{color:#9eacc4}.chat{display:flex;flex-direction:column;gap:14px;flex:1;padding:12px 0}.msg{padding:14px 17px;border:1px solid #29364c;border-radius:16px;max-width:90%;white-space:pre-wrap;line-height:1.7}.user{align-self:flex-start;background:#17365a}.bot{align-self:flex-end;background:#151f30}.composer{position:sticky;bottom:0;background:#0b1220;padding:12px 0 20px}.form{display:flex;gap:8px;background:#121d2e;border:1px solid #34445d;border-radius:18px;padding:8px}.form textarea{flex:1;resize:none;border:0;outline:0;background:transparent;color:white;font:inherit;padding:10px;min-height:48px}.form button{border:0;border-radius:13px;background:#168b78;color:white;padding:0 20px;font:inherit;font-weight:700}.hint{text-align:center;color:#7f8da5;font-size:12px;margin-top:8px}button:disabled{opacity:.5}
</style></head><body><header class="top"><div class="logo">O</div><div><strong>ORAK AI</strong><small>مساعدج الذكي — النسخة الأولية</small></div></header><main class="wrap"><section class="welcome" id="welcome"><h1>أهلاً بيج في ORAK AI</h1><p>اكتبي سؤالج وابدئي المحادثة</p></section><section class="chat" id="chat" aria-live="polite"></section><section class="composer"><form class="form" id="form"><textarea id="input" placeholder="اكتبي رسالتج هنا..." rows="1" required></textarea><button id="send">إرسال</button></form><div class="hint">تحتاج المنصة إلى إعداد مفتاح مزود الذكاء الاصطناعي لتوليد الردود.</div></section></main>
<script>
const form=document.querySelector('#form'),input=document.querySelector('#input'),chat=document.querySelector('#chat'),send=document.querySelector('#send');let messages=[];
function bubble(text,who){const el=document.createElement('div');el.className='msg '+who;el.textContent=text;chat.appendChild(el);el.scrollIntoView({behavior:'smooth',block:'end'});return el}
form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(!text)return;document.querySelector('#welcome').hidden=true;messages.push({role:'user',content:text});bubble(text,'user');input.value='';send.disabled=true;const wait=bubble('جاري التفكير...','bot');try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});const d=await r.json();wait.textContent=d.reply||d.error||'حدث خطأ';if(d.reply)messages.push({role:'assistant',content:d.reply});}catch{wait.textContent='تعذر الاتصال بالخادم. تأكدي من النشر والاتصال.'}finally{send.disabled=false;input.focus()}});
</script></body></html>
